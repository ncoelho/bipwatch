name: bips-repo

# SPEC 6.1: every 30 minutes, archive new bitcoin/bips commits that touch a BIP
# we hold a record for, and open a pull request when a spec header changed.

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

concurrency:
  group: bips-repo
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Collect commits into Postgres
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::DATABASE_URL secret is not set; skipping collection"
            exit 0
          fi
          npm run collect -- --source bips-repo

  sync-headers:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Fetch bitcoin/bips history
        run: git clone --filter=blob:none --no-checkout https://github.com/bitcoin/bips.git ../bips
      - uses: ./.github/actions/setup
      - name: Re-sync bip.yaml facts from spec headers
        id: sync
        run: |
          npm run sync-headers -- --bips ../bips --summary "$RUNNER_TEMP/sync-summary.md"
          if [ -f "$RUNNER_TEMP/sync-summary.md" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      # Fail early here so a broken sync never opens a PR. The PR itself is
      # opened with BOT_TOKEN, so the normal "Validate data" check runs on it
      # too and gates auto-merge.
      - name: Validate and build the changed data
        if: steps.sync.outputs.changed == 'true'
        run: |
          npm run validate -- --bips ../bips
          npm run build --workspace site

      - name: Open or update the pull request
        id: cpr
        if: steps.sync.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.BOT_TOKEN }}
          branch: bot/sync-headers
          delete-branch: true
          add-paths: data/bips/*/bip.yaml
          commit-message: Re-sync BIP headers from bitcoin/bips
          title: Re-sync BIP headers from bitcoin/bips
          body-path: ${{ runner.temp }}/sync-summary.md
          labels: auto-accept

      # SPEC 6.1: header-sync PRs may merge on their own once CI passes. Needs
      # a required status check on main, or GitHub has nothing to wait for.
      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number && steps.cpr.outputs.pull-request-operation != 'closed'
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" --repo "$GITHUB_REPOSITORY" --auto --squash --delete-branch
