name: Validate data

on:
  # Every PR, so it can be a required check on main (a path filter would
  # leave PRs outside those paths waiting forever).
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Spec quotes are matched against bitcoin/bips at the revision each claim cites.
      - name: Fetch bitcoin/bips history
        run: git clone --filter=blob:none --no-checkout https://github.com/bitcoin/bips.git ../bips

      - uses: ./.github/actions/setup
      - run: npm run validate -- --bips ../bips
      - run: npm run typecheck --workspace @bipwatch/data
      - run: npm run typecheck --workspace @bipwatch/collect
      - run: npm run typecheck --workspace @bipwatch/extract
      - run: npm test
