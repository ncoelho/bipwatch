name: Build site

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *' # nightly, picks up anything merged without a push trigger
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/dist
      # Deploy step goes here once hosting is chosen (Cloudflare Pages in the plan).
