name: Build site

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *' # nightly, picks up anything merged without a push trigger
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # data/freshness.json feeds the "Sources" section and /api/freshness.json.
      # Without the secret the site builds without it.
      - name: Export collector freshness
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            npm run freshness -- --export data/freshness.json --no-fail
          fi
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/dist
      # Deploy step goes here once hosting is chosen (Cloudflare Pages in the plan).
