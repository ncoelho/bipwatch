name: delving

# SPEC 6.1: every 30 minutes, archive new public Delving Bitcoin posts and
# index their BIP mentions.

on:
  schedule:
    - cron: '22,52 * * * *'
  workflow_dispatch:

concurrency:
  group: delving
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Collect posts into Postgres
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::DATABASE_URL secret is not set; skipping collection"
            exit 0
          fi
          npm run collect -- --source delving
