headline: Bitcoin Core review continues on a BIP 54 Consensus Cleanup
  implementation that leaves out mainnet activation
lead: BIP 54 bundles fixes for the timewarp attack, worst-case block validation
  time, Merkle tree weaknesses and duplicate transactions; its specification has
  been complete since 2026-05-22 and Bitcoin Inquisition already ships it. The
  spec still has no deployment section, so no signaling mechanism or parameters
  exist yet, and whether to delay activation to give pools time remains open.
