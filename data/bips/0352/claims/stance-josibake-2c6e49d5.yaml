  title: "BIP 352: Silent Payments"
statement: josibake favors changing the BIP 352 input commitment to hash only
  the lexicographically lowest outpoint. He argues that hashing and summing each
  outpoint makes collisions easier and adds scanning work, while sorting and
  concatenating all outpoints is too complex for memory-constrained hardware
  wallets.
