change:
  url: https://github.com/bitcoin/bips/pull/1458
  title: "BIP 352: Silent Payments"
statement: josibake opposes the suggested amendment to encode silent payments as
  a BIP21 URI extension instead of a new address format. He argues that a
  fallback static address encourages address reuse and harms the privacy of
  silent payment users, and that a required parameter is no better than a new
  address. He proposes keeping the sp1 bech32m encoding.
