statement: Clarify the BIP's forward-compatibility text. Its upgrade path only
  skips SegWit versions above 1, so outputs from soft forks deployed as bare
  scripts (such as bare CTV) cannot later be added to the shared-secret input
  list without a backwards-incompatible version.
