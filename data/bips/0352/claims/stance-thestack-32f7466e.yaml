statement: Sebastian Falbesoner agrees that the BIP 352 spec is ambiguous about how
  recipient groups are defined, but objects to this PR's approach of redefining
  groups by unique address and moving the K_max check. He prefers clarifying the
  originally intended per-output grouping, arguing that the PR's approach would
  add confusion because existing implementations don't follow it.
