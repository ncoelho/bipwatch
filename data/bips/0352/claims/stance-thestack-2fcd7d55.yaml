statement: Sebastian Falbesoner is not convinced that the misinterpretation scenario
  justifies changing BIP 352's reference implementation or test vectors to stop
  senders from creating outputs the receiver can't find. He would prefer, at
  most, a simple text clarification of the grouping mechanism, arguing the
  existing K_max group-size check is already sufficient.
