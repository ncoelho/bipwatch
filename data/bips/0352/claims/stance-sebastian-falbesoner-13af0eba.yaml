statement: Sebastian Falbesoner authored a change to BIP 352 adding a per-group
  recipient limit K_max of 2323. He argues that, although it is technically
  backwards incompatible, no existing Silent Payments wallet sends to that many
  recipients, so it is safe to introduce.
