id: objection-tim-ruffing-f55bd6bd
bip: 352
kind: objection
status: addressed
area: design
statement: Avoid computing the outpoint commitment by summing per-outpoint
  hashes, since summed hashes are open to Wagner-style collision attacks that
  would undermine the guarantee against generating the same receiver
  scriptPubKey.
