change:
  url: https://github.com/bitcoin/bips/pull/2153
  title: "bip352: clarify/fix specification to disallow sender to create outputs
    the receiver can't find"
statement: IsaqueFranklin supports the PR's goal of clarifying BIP 352 so
  senders cannot create more than k_max outputs for a single B_scan. He argues
  the current text checks only the recipient count and leaves room for naive
  implementations to create outputs the receiver won't find, and he notes that
  several wallets don't implement the check.
