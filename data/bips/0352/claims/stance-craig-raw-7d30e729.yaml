change:
  url: https://github.com/bitcoin/bips/pull/2372
  title: "BIP352: require the scan key path"
statement: Craig Raw proposes amending BIP 352 to require wallets to derive the
  scan key at m/352'/coin_type'/account'/1'/0 and to reserve that branch for
  scan keys only. He argues this makes exporting the scan key safe and keeps
  funds recoverable from a seed without scanning with several candidate keys.
