scope: change
statement: Peter Todd argues BIP 352 should be amended so Silent Payment
  addresses carry an expiration date, for example a 2–3 byte field counting days
  since an epoch. His reason is that these addresses are meant to be reused, so
  funds sent to an address from a lost or compromised wallet can be lost
  forever.
