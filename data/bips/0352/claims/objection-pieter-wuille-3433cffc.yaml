id: objection-pieter-wuille-3433cffc
bip: 352
kind: objection
status: addressed
area: design
statement: Replace the input hash built by summing per-outpoint hashes, since an
  adversary can cheaply find outpoint sets whose hash sums collide, with a
  construction that resists deliberate collisions.
