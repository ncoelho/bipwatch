id: objection-matt-corallo-3999ccce
bip: 352
kind: objection
status: open
area: design
part_of: bip21 update
statement: Decide whether silent payment addresses in BIP21 URIs should go in a
  standard query parameter (allowing an on-chain fallback address in the body)
  rather than in the URI body, so there is a single way to build and parse
  silent payment QR codes.
