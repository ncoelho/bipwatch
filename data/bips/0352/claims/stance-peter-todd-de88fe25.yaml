id: stance-peter-todd-de88fe25
bip: 352
kind: stance
stance: nack
scope: change
statement: Peter Todd opposes a suggested expiration-time encoding for BIP 352
  addresses in which the granularity of the limit depends on when it is applied.
  He says it is a UX nightmare and would degrade over time, and he favours a
  fixed granularity such as a 3-byte count of days.
