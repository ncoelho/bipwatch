  technical_maturity:
    score: 3
    rationale: "The core spec is settled: test vectors cover edge cases, the K_max
      recipient limit is decided, and the PSBT companions are largely resolved.
      Open design questions remain in the light-client index, including
      server-lying and dust-spam attacks and verifying complete tweak sets. The
      descriptor format (BIP 392) still needs review, and multi-party input use
      has no security proof."
