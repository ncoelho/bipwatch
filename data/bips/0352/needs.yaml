  problem_evidence:
    score: 3
    rationale: The spec describes real problems with interactive address exchange,
      notification transactions and sender linkability, and many reviewers acked
      the concept. Outside evidence that users feel this today is thin, and some
      argue the motivation is weak because fresh addresses are trivial to
      generate.
