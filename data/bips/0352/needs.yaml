    score: 3
    rationale: "The core spec is largely settled: the expiration debate, edge-case
      scalar handling, the K_max limit and test vectors have been addressed.
      Still open are a K_max grouping loophole, some consensus-invalid test
      vectors, decoder fixes, and multi-party input security with no proof. The
      light-client index carries the largest open design work, including server
      attacks that can unmask users."
