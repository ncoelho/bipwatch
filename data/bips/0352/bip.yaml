bipwatch:
  tracked: true
  category: ready-to-build
  template: complete
  # Silent payment outputs look like any taproot output, so adoption is
  # measured by which wallets can send and receive, not by onchain counts.
  adoption_measure: wallet-coverage
  summary: >-
    A reusable payment address that never shows up onchain. Senders derive a
    fresh taproot output for the receiver from their own inputs, so there is no
    notification transaction and no link between payments. The cost is that
    receivers have to scan the chain to find what they were paid.
  # Matched by the collectors' mention index. "BIP 352" and links are
  # detected without aliases.
  aliases:
    - silent payments
    - silent payment
