statement: Qualify P2MR's claimed quantum protection, or argue against Pieter
  Wuille's objection that it only holds under strict workflows most users won't
  follow and so creates a false sense of security. These workflows include no
  address reuse, no Lightning, no sharing of descriptors or xpubs, using only
  the PQC path after Q-day, and treating incoming EC-witness spends as
  unconfirmed.
