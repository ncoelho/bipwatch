statement: conduition supports P2MR as a post-quantum output type, saying it
  keeps P2TR's script tree commitment structure without the quantum-vulnerable
  cryptography and is more efficient than P2TR for script-path spends. They
  consider the alternative P2TRv2 approach short-sighted.
