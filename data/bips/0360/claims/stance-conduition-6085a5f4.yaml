id: stance-conduition-6085a5f4
bip: 360
kind: stance
stance: concept-ack
scope: change
statement: conduition proposes amending BIP 360 to require at least one merkle
  authentication path in the control block, which bans depth-zero script trees.
  He argues this removes the incentive to use P2MR over P2TR for single scripts
  and encourages cooperative spending paths and PQ fallback leaves, which
  improves privacy.
