statement: Pieter Wuille prefers P2TRv2 over the P2MR approach of BIP 360. He
  argues that P2MR's higher cost (around 15% more per transaction) would
  discourage adoption before a quantum computer appears, whereas P2TRv2
  minimizes barriers to adopting quantum-safe outputs. He adds that this
  preference assumes a narrow EC-opcode-disabling softfork can be relied upon.
