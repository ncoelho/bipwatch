id: objection-pieter-wuille-011b0be8
bip: 360
kind: objection
status: open
area: design
statement: Justify why a script-tree output without a key path is useful before
  any post-quantum signature scheme exists, given the objection that P2TR is
  strictly better for mixed EC-or-PQC spending and that pure-PQC outputs cannot
  be judged without an actual scheme.
subject:
  name: Pieter Wuille
  type: person
