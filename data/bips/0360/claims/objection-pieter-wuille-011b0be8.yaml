  type: forum
  title: Changes to BIP-360 - Pay to Quantum Resistant Hash (P2QRH)
  date: 2025-07-28
  retrieved: 2026-11-14
  quote: If EC is disabled, P2QRH being available independently of PQC locks seems
    irrelevant to me, because nobody should be using it without PQC locks. For
    mixed EC-or-PQC spending conditions, P2TR is strictly better in
    functionality, privacy, and (typically) cost.
