statement: Ethan Heilman likes the proposed BIP 360 change about depth-zero
  script trees because it encourages privacy, and he thinks the extra 32 bytes
  are worth it. He has no strong objection, though he suggests depth-zero leaves
  could be OP_SUCCESS (anyone-can-spend) instead of failing, and he still needs
  to catch up on the mailing list discussion.
