statement: Hunter Beast, the BIP's author, defends the current BIP 360 design
  against suggestions to step back and revisit design goals. He prefers to prove
  the design out in practice, and argues that it keeps witness-script support
  and that libbitcoinpqc contains the complexity of the post-quantum signature
  schemes.
