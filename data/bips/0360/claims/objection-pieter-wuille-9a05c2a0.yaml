id: objection-pieter-wuille-9a05c2a0
bip: 360
kind: objection
status: open
area: design
part_of: public key recovery for ec leaves
statement: Weigh the objection that merging P2MR-style and P2TRH-style
  commitments into one output type gives up the single-anonymity-set advantage
  while needing a new BIP340 variant with keyhash commitment and recovery,
  losing batch validation and breaking ring-signature-style constructions; it
  may be better to deploy separate output types.
