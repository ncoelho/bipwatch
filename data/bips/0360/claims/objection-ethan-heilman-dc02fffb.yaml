id: objection-ethan-heilman-dc02fffb
bip: 360
kind: objection
status: addressed
area: design
statement: Infer the post-quantum signature algorithm from the public key length
  alone rather than from both key and signature, so the output commits to the
  algorithm and a wrong-length signature is simply rejected.
subject:
  name: Ethan Heilman
  type: person
applies_to_version: 0.4.0
source:
  url: https://github.com/bitcoin/bips/pull/1670#discussion_r1881140873
  type: github
  title: BIP 360 - Pay to Merkle Root (P2MR)
  date: 2024-12-11
  retrieved: 2026-11-22
  quote: If we infer the signature algorithm from the public key alone, then we
    will reject a signature which has the wrong length for that algorithm. This
    makes error handling easier and the output commits to the signature
    algorithm.
  verified: true
