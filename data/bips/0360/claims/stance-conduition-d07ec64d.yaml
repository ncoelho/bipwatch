statement: conduition agrees quantum resistance is an important long-term
  problem, but opposes the P2QRH proposal's approach of soft-forking in a
  quantum-resistant address format built on today's post-quantum signature
  algorithms. They argue those algorithms are unlikely to age well, and suggest
  a client-side hash-based fallback (DASK) for now instead.
