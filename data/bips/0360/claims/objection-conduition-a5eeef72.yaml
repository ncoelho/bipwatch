statement: Decide whether the post-quantum signature opcode for P2MR leaves
  should be a mandatory unified hybrid scheme (e.g. SHRINCS+BIP340). conduition
  objects that this adds about 100 bytes per input and creates technical debt
  after Q-day, and argues that opt-in hybrids using separate leaves or combined
  checks in one leaf give comparable security.
