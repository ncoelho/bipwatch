statement: "Respond to Matt Corallo's objection that P2MR with an EC fallback
  leaf gives no real protection to the wallets that most need to migrate: those
  reuse one static address and will not pay the cost of hash-based signatures,
  so a CRQC can steal funds through the exposed EC key."
