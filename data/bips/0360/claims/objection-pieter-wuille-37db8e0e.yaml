statement: Answer the objection that offering only P2MR, with no key path, as
  the post-quantum upgrade path forces P2TR users to choose between P2TR's
  advantages and PQC, and that its security edge over a P2TRv2 with a key path
  depends on workflow changes users are unlikely to make.
