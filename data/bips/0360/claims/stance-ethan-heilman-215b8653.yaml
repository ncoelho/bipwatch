statement: Ethan Heilman argues that P2MR is preferable to a P2TRv2 design whose
  key spend path would later need to be disabled by soft fork. He reasons that
  disabling it early enough is equivalent to activating P2MR, while P2MR keeps
  funds safe even if quantum attacks arrive unexpectedly.
