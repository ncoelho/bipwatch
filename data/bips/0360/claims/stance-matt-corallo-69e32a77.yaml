statement: Matt Corallo disagrees with the approach taken in the BIP-360 (then
  P2QRH) discussion. He argues that lattice-based post-quantum schemes will not
  be ready for Bitcoin for a long time, and that the only practical short-term
  step is to add a hash-based scheme that wallets include in their taproot
  outputs.
