statement: Jose Storopoli opposes BIP-360, fearing it will become a mistake
  because post-quantum signature schemes add orders of magnitude to
  key/signature sizes and verification cost, and lattice-based cryptography is
  still immature; he prefers P2TRH or disabling key path spends instead.
