statement: "Antoine Poinsot argues that P2MR as currently specified in BIP 360
  has drawbacks. It gives up Taproot's benefits: indistinguishable outputs,
  hiding whether a script path exists, and incentivizing keypath spends. He does
  not think those should be discarded if there are other ways of mitigating
  quantum-computer risks."
