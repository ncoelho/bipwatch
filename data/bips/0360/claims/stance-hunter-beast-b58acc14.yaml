statement: Hunter Beast, introducing the draft P2QRH proposal (later BIP 360),
  argues that Bitcoin needs a concrete quantum-resistant signature scheme ready
  in advance of a quantum emergency, because development and activation are
  slow. He presents it as a rough draft and asks for feedback on whether to
  continue.
