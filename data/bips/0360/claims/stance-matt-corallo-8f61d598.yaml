id: stance-matt-corallo-8f61d598
bip: 360
kind: stance
stance: conditional
condition: Strip out all signature schemes except straightforward hash-based
  ones (perhaps only SPHINCS+), embed them only in a taproot leaf, and provide
  them via an opcode to allow multisig.
scope: proposal
statement: Matt Corallo suggests that if a post-quantum proposal like BIP-360 is
  pursued in the short-to-medium term, it should be reduced to hash-based
  signatures (maybe only SPHINCS+) embedded in a taproot leaf as an emergency
  break-glass option. He considers BIP 32 compatibility not a big concern for
  that use.
