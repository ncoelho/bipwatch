scope: proposal
statement: Jonas Nick objects to BIP 360's approach of adding three post-quantum
  signature schemes to consensus. He argues that offloading the choice of scheme
  to users does not solve the problem, and that it adds massive complexity and
  new cryptographic assumptions.
