scope: proposal
statement: conduition considers BIP 360's P2MR a better choice than a
  re-deployed P2TR with keypath-disabling, because it relies on weaker security
  assumptions, drops elliptic-curve code from wallets, and uses less witness
  space for script-path spends. They accept a small increase in witness size as
  a fair price for quantum security.
