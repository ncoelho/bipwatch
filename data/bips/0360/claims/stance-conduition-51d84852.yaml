statement: "conduition argues for P2MR over P2TRv2 as the post-quantum output
  type: P2TRv2 still depends on ECDLP and only promises quantum security later,
  while P2MR is self-contained, has a minor witness size cost, and remains
  useful as an efficient script-path-only output even if quantum computers never
  matter."
