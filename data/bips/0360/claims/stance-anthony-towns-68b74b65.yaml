id: stance-anthony-towns-68b74b65
bip: 360
kind: stance
stance: conditional
condition: P2MR should be introduced together with a quantum-safe (post-quantum)
  spending path from day one.
scope: proposal
statement: Anthony Towns argues that P2MR, unlike a P2TRv2 key-path design,
  preserves users' ability to protect their own coins, and that the extra
  key-path bytes don't matter. He is nonetheless very skeptical of introducing
  P2MR without a post-quantum spending path available from the start, given that
  some already consider a cryptographically relevant quantum computer
  inevitable.
