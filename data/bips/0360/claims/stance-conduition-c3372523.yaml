  title: "bip360: depth-zero script trees should be anyone-can-spend"
statement: Conduition proposes changing BIP 360 so that depth-zero (single-leaf)
  script trees become anyone-can-spend via an auto-success path. Conduition
  argues this keeps users from leaving out PQ or cooperative leaves just to save
  32 bytes, improves privacy alignment with P2TR, and leaves the path open for a
  future soft fork.
