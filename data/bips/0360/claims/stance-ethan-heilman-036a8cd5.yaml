statement: Ethan Heilman defends P2MR against the objection that address reuse
  undermines its quantum safety. He argues that even if some users reuse
  addresses, P2MR still protects the large majority of coins, and that wallets
  allowing EC address reuse should simply not be considered PQ safe.
