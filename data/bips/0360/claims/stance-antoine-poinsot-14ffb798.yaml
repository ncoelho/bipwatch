statement: Antoine Poinsot considers BIP 360's approach of keeping Taproot's
  Merkle tree of BIP 342 Scripts a fine design. He clarifies that his case for a
  post-quantum output type is not a defense of BIP 360, because it neither
  enables a hash-based PQ signature scheme nor disables EC opcodes.
