  title: BIP 360 - Pay to Merkle Root (P2MR)
statement: Hunter Beast opposes extending BIP 360 to change Bitcoin's hash
  functions, for example to Keccak-based constructions. He wants it limited to
  signature algorithms because the threat from Grover's algorithm is more remote
  than the threat from Shor's.
