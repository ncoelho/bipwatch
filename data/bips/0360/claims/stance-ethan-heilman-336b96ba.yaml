statement: Ethan Heilman, who works on BIP 360, argues that a break in Bitcoin's
  signature scheme (for example by a quantum computer) is the one vulnerability
  that could destroy Bitcoin. He says adding a failover signature mechanism
  before such an attack happens is the most effective security upgrade
  available, and gives this as what motivates his work on BIP 360.
