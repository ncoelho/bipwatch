statement: Ethan Heilman argues for adopting P2MR together with post-quantum
  signatures, so wallets can offer quantum-safe outputs (Schnorr or PQ) with
  Schnorr as the default spend. He says the extra cost is small, about 10 vbytes
  per input, and that letting people opt in early protects them cheaply.
