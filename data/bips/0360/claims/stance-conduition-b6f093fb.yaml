statement: conduition defends P2MR's design against a key-spend-based P2TRv2
  alternative. They argue that P2MR's privacy incentive problem is small and
  that its efficiency in some cases is a feature. They also argue that risking
  the security of everyone's coins for that privacy gain is not worth it.
