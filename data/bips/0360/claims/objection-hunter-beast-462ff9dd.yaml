area: design
statement: Matt Corallo argued that the proposal should drop its bundled
  post-quantum signature schemes in favour of simple hash-based signatures,
  placed in a taproot leaf and exposed through an opcode so multisig works; the
  current spec removes the signature schemes and leaves PQ signatures to future
  opcodes or leaf versions in script trees.
