id: stance-ethan-heilman-2b146c48
bip: 360
kind: stance
stance: concept-ack
scope: proposal
statement: Ethan Heilman supports adopting BIP 360 (P2MR) together with a
  hash-based SLH-DSA signature opcode. He sees it as an opt-in way to give
  Bitcoin algorithm agility, so holders can hedge against classical or quantum
  breaks of Schnorr without the confiscation that disabling Taproot key spends
  would cause.
