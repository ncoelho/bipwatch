statement: Correct the rationale claiming that every new signature algorithm
  needs a new tapleaf version. A single new tapscript version could redefine
  OP_CHECKSIG to always succeed for pubkeys in an unrecognized format, which
  would allow future signature algorithms without further tapleaf versions.
