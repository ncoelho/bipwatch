id: objection-pieter-wuille-88bbb204
bip: 360
kind: objection
status: open
area: design
statement: Address Pieter Wuille's objection that P2MR, which has no built-in
  expectation that its EC paths will be disabled before Q-day, is too
  restrictive for today's workflows to support meaningful migration. He argues
  for a variant with a planned disabling of its own EC opcodes (P2MR+ED) or for
  P2TRv2 instead.
