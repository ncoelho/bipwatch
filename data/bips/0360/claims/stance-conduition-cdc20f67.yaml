  title: "bip360: depth-zero script trees should be anyone-can-spend"
statement: conduition supports amending BIP 360 so that a depth-zero script tree
  leaf acts as OP_SUCCESS (anyone-can-spend) rather than failing. They say this
  keeps P2MR open to future extensions such as isogeny key tweaking or
  lattice-based schemes, and plan to make the change.
