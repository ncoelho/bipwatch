stance: nack
scope: proposal
statement: Pieter Wuille opposes the P2MR approach. He argues that an output
  type with no planned output-specific EC disabling ("Merkle-Never") is too
  restrictive for most users and insufficient for a real migration. He prefers a
  taproot-based output with a later narrow EC-disabling softfork (P2TRv2), and
  thinks adding P2MR could weaken that path.
