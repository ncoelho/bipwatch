statement: Matt Corallo sees no reason to adopt P2MR over continuing to use P2TR
  (or a signaling "P2TRv2"). He argues that address reuse means P2MR wallets
  using Schnorr will expose their public keys anyway, so P2TR gives the same
  result while saving witness bytes.
