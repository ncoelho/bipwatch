id: open-question-ajtowns-ba0a23ca
bip: 360
kind: open-question
status: open
area: design
statement: 'Evaluate whether a "P2TRH" alternative should be adopted instead of
  or alongside P2MR: commit to a hash of the taproot output key and recover the
  key from the signature, saving 32 bytes on EC key-path spends while hiding the
  key at rest.'
subject:
  name: ajtowns
  type: person
applies_to_version: 0.12.0
source:
  url: https://delvingbitcoin.org/t/public-key-recovery-for-ec-leaves-in-p2mr-bip-360/2603/17
  type: forum
  title: Public key recovery for EC leaves in P2MR (BIP-360)
  date: 2026-06-18
  retrieved: 2026-11-15
  quote: Have you considered "P2TRH" with pubkey recovery? If you take `Q=P + H(P;
    S)*G` as usual per taproot, but commit to H(Q) in the scriptPubKey, then a
    signature by Q allows recovering Q and comparing to H(Q), so you avoid the
    32B cost
  verified: true
