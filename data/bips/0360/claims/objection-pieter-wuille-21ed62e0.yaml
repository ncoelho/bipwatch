id: objection-pieter-wuille-21ed62e0
bip: 360
kind: objection
status: open
area: ux
statement: Address the concern that EC leaves in P2MR stay quantum-safe only if
  users never share public keys or xpubs. That rules out BIP32-based multisig,
  escrow, descriptor watch-only wallets and indexing services, so most users may
  not migrate, or may migrate insecurely.
