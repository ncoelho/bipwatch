id: objection-pieter-wuille-669b59ca
bip: 360
kind: objection
status: open
area: design
statement: Pieter Wuille argues that P2MR without an expected, relied-upon later
  disabling of elliptic-curve spends in the output type cannot support a real
  migration. Its quantum safety depends on users never exposing public keys,
  which rules out xpubs, multisig, Lightning, silent payments and escrow. He
  says a taproot-style output with a planned narrow EC-disabling soft fork is
  needed instead, and the design must decide which expectation it carries.
