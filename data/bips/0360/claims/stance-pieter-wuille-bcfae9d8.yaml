id: stance-pieter-wuille-bcfae9d8
bip: 360
kind: stance
stance: concept-ack
scope: change
statement: Pieter Wuille proposes adding a Tripwire to P2MR, so that EC opcodes
  and paths are automatically disabled once someone spends a NUMS point. He
  considers the result an unambiguous improvement over P2MR as specified,
  because it makes the later EC-disabling softfork non-confiscatory and pushes
  users to test the post-quantum paths. This is support for the amendment, not
  an endorsement of BIP 360 as a whole.
