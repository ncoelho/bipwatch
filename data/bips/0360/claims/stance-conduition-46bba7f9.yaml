  quote: >-
    Therefore, P2MR is the better long-term choice.


    If we assume Bitcoin will survive long into the future after CRQCs appear,
    then we should favor the best long-term design choices over short-term
    compromises. Thus, we should deploy P2MR and NOT deploy P2TRv2.
