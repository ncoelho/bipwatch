statement: ArmchairCryptologist would prefer to deploy P2MR alongside a P2TRv2
  variant, with P2MR serving self-reliant long-term holders who want full
  control over their funds and protection from quantum attacks. They consider
  this worth the costs of easier wallet fingerprinting and added implementation
  complexity.
