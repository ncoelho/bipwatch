statement: Pieter Wuille argues that P2MR, as an output type with no built-in
  expectation that its EC paths will be disabled, is insufficient on its own for
  a meaningful quantum migration. He says it is too incompatible with today's
  workflows to be widely adopted, and he prefers P2TRv2. He allows that P2MR
  could perhaps be added alongside P2TRv2.
