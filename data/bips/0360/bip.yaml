  # Earlier drafts were called Pay to Quantum Resistant Hash (P2QRH).
  adoption_measure: activation-and-usage
  summary: >-
    A new output type, Pay-to-Merkle-Root, that works like taproot without the
    key path spend, so coins can only be spent through a script tree. The aim is
    resistance to long-exposure attacks by future quantum computers and to
    future breaks of Bitcoin's elliptic curve cryptography.
