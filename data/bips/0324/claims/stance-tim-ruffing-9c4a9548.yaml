  title: "bip324: Remove garbage authentication packet (breaking change)"
statement: Tim Ruffing proposes removing BIP 324's separate garbage
  authentication packet by merging it into the first packet after garbage
  termination. They argue this simplifies implementations, and that the phases
  stay properly separated because the AEAD checks the garbage before the version
  contents are read.
