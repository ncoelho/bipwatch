statement: ajtowns proposes assigning a hardcoded one-byte BIP 324 v2 message
  type ID to the FEATURE message. He argues that the message is sent repeatedly
  before verack, so a short ID saves bandwidth, and that the ID must be
  hardcoded because it is used before negotiation completes.
