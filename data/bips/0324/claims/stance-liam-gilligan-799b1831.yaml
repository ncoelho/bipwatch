statement: Liam Gilligan argues that a post-quantum upgrade to BIP 324's
  transport is needed, because a quantum computer breaks its ECDH
  confidentiality and enables harvest-now-decrypt-later attacks. He favours the
  classical-then-upgrade approach, which negotiates a PQ key exchange inside the
  existing encrypted channel, over a one-shot hybrid handshake. His reasons are
  DoS surface, preserving the pseudorandom bytestream, and extending rather than
  replacing BIP 324.
