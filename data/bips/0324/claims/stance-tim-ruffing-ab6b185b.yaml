scope: change
statement: Tim Ruffing authored and argued for a breaking change to BIP 324 that
  removes the separate garbage authentication packet by merging it into the
  first packet sent after garbage termination. He says this simplifies
  implementations and that the key exchange and version phases remain properly
  separated because the AEAD checks the garbage before the contents are read.
