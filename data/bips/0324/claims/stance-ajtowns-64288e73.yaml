  title: "BIP 324: Clarify equivalence between 1 and 13 byte message types"
statement: ajtowns proposes clarifying in BIP 324 that 1-byte short message IDs
  are aliases for the equivalent 12-byte ASCII message types. He argues this
  keeps a single namespace for message types and makes dynamically allocating
  short IDs simpler.
