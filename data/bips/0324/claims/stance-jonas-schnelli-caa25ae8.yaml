id: stance-jonas-schnelli-caa25ae8
bip: 324
kind: stance
stance: nack
scope: change
statement: Jonas Schnelli sees no reason to switch BIP 324's AEAD to XChaCha20
  with random nonces. He argues that using a message sequence number as the
  nonce, with rekeying after 1GB, already rules out nonce/key reuse.
subject:
  name: Jonas Schnelli
  type: person
