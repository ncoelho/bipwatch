  title: New BIP - v2 peer-to-peer message transport protocol
  date: 2019-06-17
  retrieved: 2026-11-14
  quote: Using XChaCha20 with the possibility of a random nonce could be done, but
    I don’t see a reason to use it in our case since the usage of a sequence
    number as nonce seems perfectly save.
