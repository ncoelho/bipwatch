statement: "Pieter Wuille supports a proposed BIP324 design change: give short
  message IDs only to some messages, so a short-ID mapping could be negotiated
  without a re-negotiation mechanism. He says this avoids the variable-length
  encoding question and its complexity for messages where bandwidth doesn't
  matter."
