change:
  url: https://github.com/bitcoin/bips/pull/1378
  title: "Add BIP324: v2 P2P Transport Protocol"
statement: Pieter Wuille argued against a suggested amendment to BIP 324 that
  would replace the v2 service flag with new BIP155 network types on separate
  ports. He said it would duplicate address relay and addrman entries, slow
  address propagation, require opening extra ports, and need special-cased
  preference and anti-DoS logic, so he preferred keeping the service flag as a
  hint.
