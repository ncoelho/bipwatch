statement: dr-orlovsky objects to BIP 324's unauthenticated exchange-exchange
  key scheme, arguing that it leaves room for MitM attacks and gains no
  anonymity because the connecting peer already knows its target. He argues that
  an exchange-known scheme like Noise_XK would be more adequate.
