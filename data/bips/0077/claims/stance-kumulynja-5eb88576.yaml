  title: "BIP77: Propose to encode `+` as `%2B` in pj param of Bitcoin URIs"
statement: kumulynja proposes amending BIP 77 so that the `+` character in the
  pj parameter of Bitcoin URIs is percent-encoded as `%2B`. They argue `+` has a
  reserved meaning in query parameters, and that encoding it keeps parsing
  reliable across wallets and libraries while preserving QR alphanumeric mode.
