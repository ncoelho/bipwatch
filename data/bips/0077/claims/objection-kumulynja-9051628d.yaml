  title: "BIP77: Propose to encode `+` as `%2B` in pj param of Bitcoin URIs"
  date: 2025-06-30
  retrieved: 2026-11-14
  quote: The `+` character also has reserved meaning in query parameter contexts
    (Bitcoin URI), different  from in path contexts (payjoin URI), and improper
    encoding can break parsing in standards-compliant URI parsers.
