id: objection-kumulynja-9051628d
bip: 77
kind: objection
status: addressed
area: design
statement: Avoid using `+` unencoded as the fragment parameter separator in the
  pj parameter, because common URI parsers treat `+` in query contexts as a
  space and break parsing.
