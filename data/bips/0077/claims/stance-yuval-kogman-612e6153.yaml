id: stance-yuval-kogman-612e6153
bip: 77
kind: stance
stance: ack
scope: change
statement: Yuval Kogman supports changing BIP 77's fragment parameter separator
  from `+` to `-`. He argues that `+` causes friction, and that only two
  production wallets (Bull Bitcoin Mobile and Cake Wallet, both using PDK) would
  be affected.
