  title: "BIP77: Propose to encode `+` as `%2B` in pj param of Bitcoin URIs"
statement: Yuval Kogman opposes the proposed change to BIP 77 that would require
  encoding `+` as `%2B` in the pj parameter of Bitcoin URIs. He argues the spec
  already accommodates libraries that turn `+` into a space, and that mandating
  the escaping would burden every implementation.
