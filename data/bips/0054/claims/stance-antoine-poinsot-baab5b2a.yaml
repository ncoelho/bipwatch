id: stance-antoine-poinsot-baab5b2a
bip: 54
kind: stance
stance: conditional
condition: Transactions with more than 2500 legacy signature operations are
  first made non-standard, and there is good reason to believe the vast majority
  of hashrate won't mine such a transaction.
scope: proposal
statement: Antoine Poinsot argues that BIP 54 should not be activated until
  pathological transactions that exceed its 2500 legacy sigop limit are
  non-standard and nearly all hashrate would refuse to mine them. Otherwise, he
  says, activation opens a major DoS vector against unupgraded miners.
