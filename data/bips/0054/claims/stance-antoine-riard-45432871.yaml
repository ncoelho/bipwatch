statement: Antoine Riard questions whether BIP 54's proposed 2500
  per-transaction sigops limit was chosen with full-node costs other than CPU in
  mind. He notes that an attacker could shift the load to fetching many UTXOs,
  and wonders whether a better value could be picked, asking whether worst-case
  transactions maximizing UTXO fetches were analyzed.
