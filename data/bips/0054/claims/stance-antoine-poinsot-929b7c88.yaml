statement: Antoine Poinsot, the BIP author, defends including the invalidation
  of 64-byte transactions in the Consensus Cleanup, arguing that the
  discontinuity is less bad than keeping the weakness it creates for SPV
  verifiers. He calls it one of the less important fixes but prefers to keep it
  unless new arguments or data emerge.
