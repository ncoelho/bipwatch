statement: Antoine Poinsot, a BIP 54 author, defends the BIP's choice to
  constrain the coinbase nSequence so that timelock validation is enforced. He
  argues this guarantees that no post-activation coinbase transaction can be a
  duplicate, which reduces complexity.
