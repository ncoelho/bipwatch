statement: Matt Corallo defends the Consensus Cleanup proposal's removal of
  OP_CODESEPARATOR by soft fork. He says nobody is known to use it, that
  removing it simplifies checksig analysis, and that a proposed alternative of
  charging extra weight does not solve the problem.
