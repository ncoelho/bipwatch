statement: Antoine Poinsot defends BIP 54's invalidation of 64-byte
  transactions. He admits it is inelegant but calls it the least bad option
  compared with leaving a footgun for upper-layer developers or adding a new
  sparse Merkle tree, which would effectively mandate an extension block.
