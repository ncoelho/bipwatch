statement: Antoine Riard supports BIP 54's approach of committing the block
  height in the coinbase nLocktime rather than in an additional OP_RETURN
  output. He argues nLocktime is already a mandatory field and so more
  space-efficient, and that it adds no new cryptoeconomic attack risk.
