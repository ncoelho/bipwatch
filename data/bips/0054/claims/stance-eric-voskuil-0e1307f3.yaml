statement: Eric Voskuil opposes the Consensus Cleanup's rule invalidating
  64-byte transactions. He argues it would not make block hashes unique
  identifiers and would not detect malleated blocks any earlier. In his view it
  adds validation cost and complexity, since checking the coinbase for a null
  point already suffices.
