statement: ajtowns favors making coinbase transactions unique by requiring their
  nLockTime to match the BIP34 height, rather than requiring a witness
  commitment. He reasons that people who generate empty blocks with simple
  manual scripts would find bumping nLockTime much easier than adding a coinbase
  witness and its commitment.
