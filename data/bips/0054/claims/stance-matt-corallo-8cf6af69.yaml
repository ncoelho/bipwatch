statement: Matt Corallo, the proposal's author, puts forward the Great Consensus
  Cleanup soft fork to remove oddities in the consensus rules and fix several
  vulnerabilities. He argues that the timewarp vulnerability should obviously be
  fixed because exploiting it could only serve malicious inflation or extension
  blocks.
