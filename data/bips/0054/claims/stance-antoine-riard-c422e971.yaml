scope: proposal
statement: Antoine Riard agrees that BIP 54's 2500 legacy signature-operation
  limit is needed for DoS protection. He cautions that, as a future consensus
  rule, it could cap the number of participants in large off-chain constructions
  such as payment pools, and he asks for a reference implementation so the
  details can be reviewed.
