statement: In the Bitcoin Core BIP 54 tests, disable the deployment with a
  NEVER_ACTIVE start time (-vbparams=consensuscleanup:-2:0) instead of 0:0, so
  it cannot lock in and activate when the node mines enough signalling blocks
  itself.
