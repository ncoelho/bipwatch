statement: Antoine Poinsot defends BIP54's "potentially executed" sigops limit
  as the right mitigation. He argues it targets exactly the harmful
  quadratic-hashing behaviour with minimal impact on legitimate usage, and that
  alternatives would yield diminishing returns with a larger confiscatory
  surface.
