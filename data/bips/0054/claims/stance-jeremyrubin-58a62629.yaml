id: stance-jeremyrubin-58a62629
bip: 54
kind: stance
stance: conditional
condition: Deployment parameters should not be changeable after the BIP is
  marked Complete, for example by moving them to a separate
  deployment-parameters BIP that stays incomplete until the deployment is
  buried.
scope: change
change:
  url: https://github.com/bitcoin/bips/pull/2172
  title: "BIP 54: progress to Complete"
statement: Jeremy Rubin objects to moving BIP 54 to Complete while still
  allowing its consensus or deployment parameters to change afterwards, calling
  that a recipe for disaster. He suggests putting deployment parameters in a
  separate BIP that stays incomplete until buried.
