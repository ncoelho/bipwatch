statement: Russell O'Connor opposes the Great Consensus Cleanup's proposed
  restriction on sighash type byte values. He argues it addresses no security
  threat and could destroy funds held in non-standard but valid transactions. He
  also says the rarity of such transactions on-chain cannot justify the soft
  fork, because policy already makes them non-standard.
