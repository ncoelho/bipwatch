statement: Russell O'Connor objects to the Great Consensus Cleanup's proposed
  disabling of OP_CODESEPARATOR. He argues that users may already have funds
  committed to legitimate scripts using it, hidden behind P2SH, and that
  disabling it risks destroying their money. He proposes pricing
  OP_CODESEPARATOR by weight instead.
