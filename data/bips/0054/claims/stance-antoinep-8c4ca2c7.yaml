statement: Antoine Poinsot proposes that the Consensus Cleanup mitigate worst-case
  block validation time with a 2,500 per-transaction limit on legacy (bare and
  P2SH) input sigops. He argues this gives a 40x reduction with a simple,
  flexible rule that minimizes the confiscatory surface, and he judges a further
  combined rule not worth its extra confiscatory surface.
