statement: Eric Voskuil objected that invalidating 64-byte transactions is
  redundant for rejecting malleated block messages, because they can be detected
  cheaply by checking for the coinbase null point, and that the rule only slows
  validation; the spec keeps the rule and justifies it by its benefit to Merkle
  proof users.
