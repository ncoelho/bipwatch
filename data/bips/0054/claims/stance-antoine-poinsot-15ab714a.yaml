  title: "bip54: add coinbase locktime and sequence to GBT"
statement: Antoine Poinsot is skeptical of the change adding coinbase locktime
  and sequence fields to the getblocktemplate response for BIP 54. He considers
  the fields fairly redundant, since miners can already derive them from the
  block height they receive, and thinks requiring a newer Bitcoin Core version
  may be a higher bar than using that information.
