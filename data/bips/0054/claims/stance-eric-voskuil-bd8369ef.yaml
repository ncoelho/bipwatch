statement: Eric Voskuil opposes the Consensus Cleanup's rule making 64-byte
  transactions invalid. He argues it is a redundant rule that would slow
  validation, since that malleation can already be detected cheaply by checking
  for the coinbase null point, and he considers caching invalid blocks
  counterproductive.
