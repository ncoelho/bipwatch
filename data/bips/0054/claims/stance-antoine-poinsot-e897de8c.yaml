id: stance-antoine-poinsot-e897de8c
bip: 54
kind: stance
stance: approach-ack
scope: proposal
statement: Antoine Poinsot defends BIP 54's approach of invalidating 64-byte
  transactions. He argues that preventing Merkle malleability in only one
  direction is sufficient and requires no changes from SPV verifiers, because
  grinding an inner node to match a meaningful transaction is computationally
  infeasible.
