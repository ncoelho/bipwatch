statement: Russell O'Connor opposes the cleanup proposal's plan to disable
  OP_CODESEPARATOR in P2SH scripts. He argues the goal should be removing the
  vulnerability, not the opcode, and suggests that raising the opcode's weight
  by about 572 bytes would be much better.
