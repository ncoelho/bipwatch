statement: Murch opposes this change to BIP 54, which would distinguish how
  miners enforce the two timestamp restrictions. He argues that
  negative-duration difficulty periods can only arise from a deliberate
  majority-hashrate attack, so worrying about accidental miner templates is
  unwarranted.
