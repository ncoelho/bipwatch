statement: Antoine Riard thinks BIP 54 is not yet ready to finalize. In his
  view, the open technical disagreements must be resolved first, especially over
  outlawing 64-byte transactions, and the reference implementation needs more
  review and testing. He suggests activation could realistically be considered
  in the second half of 2027 if community consensus exists by then.
