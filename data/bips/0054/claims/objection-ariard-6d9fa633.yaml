statement: "Qualify the Motivation's claim that users of Merkle proofs need not
  even know a workaround is necessary: multi-party protocols that cache
  pre-signed transactions (e.g. Lightning on a BIP157 client) would now have to
  make sure counterparty contributions cannot produce a 64-byte transaction."
