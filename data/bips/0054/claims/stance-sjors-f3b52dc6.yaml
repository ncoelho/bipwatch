statement: Sjors argues that the 600-second backwards grace period in the
  timewarp fix is too tight and should be raised to 2 hours in any future
  consensus cleanup proposal. His reason is that nodes should not be assumed to
  have accurate clocks, and nTime rolling can combine with blocks timestamped in
  the future.
