statement: Matt Corallo, the proposal's author, defends the Great Consensus
  Cleanup's disabling of OP_CODESEPARATOR in non-segwit scripts, arguing it is a
  significant vulnerability with no practical use case and that the remote
  chance of rendering some funds unspendable does not justify leaving it
  unfixed.
