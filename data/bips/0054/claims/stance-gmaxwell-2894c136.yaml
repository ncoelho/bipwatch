statement: gmaxwell opposes modifying BIP54's timewarp fix to allow a future
  soft fork for the nTime overflow. He sees no particular value in avoiding a
  hardfork for this issue, considers using timewarp for it unclean, and is
  concerned that such a change would open room for abuse.
