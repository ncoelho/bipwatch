statement: Antoine Poinsot, who is reviving the Great Consensus Cleanup,
  concludes from a year of research that it should fix the timewarp and
  Murch-Zawy attacks, limit legacy sigops per transaction, invalidate 64-byte
  transactions, and require the coinbase nLockTime to be set to the block height
  minus 1. He is drafting a BIP with these specs.
