statement: Russell O'Connor opposes the Consensus Cleanup's proposed disabling
  of OP_CODESEPARATOR, arguing that funds in P2SH scripts relying on it to
  commit to a specific branch could be permanently lost. He suggests instead
  charging extra weight for its execution or limiting how many can be executed
  per script.
