statement: Eric Voskuil challenged the rationale that invalidating 64-byte
  transactions lets nodes cache invalid block hashes to avoid re-downloading and
  re-validating, arguing that malleated blocks are cheaper to discard early and
  that caching by block hash is not optimal; the rationale needed to be dropped
  or justified.
