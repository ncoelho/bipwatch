statement: Antoine Poinsot argues that preventing the forward blocks exploit is
  an intended goal of the Consensus Cleanup timewarp fix, not a side effect. He
  sees it as a benefit that any lifting of block space limits would then need
  users to opt into a consensus change rather than being forced on them through
  an exploit.
