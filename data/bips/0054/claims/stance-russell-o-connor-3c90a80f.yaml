id: stance-russell-o-connor-3c90a80f
bip: 54
kind: stance
stance: nack
scope: change
statement: Russell O'Connor opposes the Great Consensus Cleanup's removal of
  OP_CODESEPARATOR by consensus. He argues that simplifying Bitcoin's
  theoretical operation is not sufficient reason to remove usable opcodes, and
  that OP_CODESEPARATOR turned out to be useful. He supports making it
  non-standard and proposes counting executed OP_CODESEPARATOR/CheckSig pairs
  instead.
