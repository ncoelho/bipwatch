statement: "Antoine Poinsot argues that all the consensus cleanup fixes should
  be bundled into one soft fork, since deployment has a large fixed cost and
  patching only some security bugs would leave the protocol partly vulnerable.
  He also defends the new validation-time mitigation as conservative: it only
  adds a transaction-level limit and disables no opcodes."
