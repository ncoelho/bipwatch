id: stance-russell-o-connor-287f7037
bip: 54
kind: stance
stance: nack
scope: change
statement: Russell O'Connor opposes the Consensus Cleanup's proposed
  invalidation of non-standard sighash type bytes. He argues that users may hold
  unbroadcast presigned transactions using such bytes, which would put their
  funds at risk, and that caching the sighash midstate is an available
  alternative.
