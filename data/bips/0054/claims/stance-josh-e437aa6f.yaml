bip: 54
kind: stance
stance: conditional
condition: BIP54's timewarp fix is modified, for example by committing a u64
  timestamp in the coinbase, so that a future soft fork can still resolve the
  2106 nTime overflow.
scope: proposal
statement: josh supports preventing the timewarp attack. He argues BIP54's
  current rule inadvertently rules out a future soft fork for the nTime
  overflow, and he prefers a fix that does not bind future generations,
  proposing a coinbase u64 timestamp modification.
