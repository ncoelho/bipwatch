statement: Russell O'Connor opposes the Consensus Cleanup's plan to invalidate
  unusual sighash type bytes. He prefers the alternative of caching the sha256
  midstate, because consensus rule changes should be avoided when reasonable
  alternatives exist, though he concedes the change is not unprecedented.
