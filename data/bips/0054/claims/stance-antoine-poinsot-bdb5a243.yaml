  title: "bip54: add coinbase locktime and sequence to GBT"
statement: Antoine Poinsot opposes adding coinbase locktime and sequence fields
  to getblocktemplate in BIP 54. He argues it does not help pools with BIP 54
  forward compatibility, since they already have the block height, and that any
  such fields belong in the GBT BIP rather than BIP 54.
