statement: Antoine Riard believes BIP 54's proposed 2500 sigops limit reduces
  the worst case for quadratic hashing without giving attackers an advantage on
  prevout lookup cost. He says his earlier concern about double validation no
  longer applies after recent Bitcoin Core changes.
