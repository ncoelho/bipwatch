statement: evoskuil questions whether BIP 54's consensus rule against 64-byte
  transactions is needed. He argues that malleation only affects node caching
  optimizations and SPV inclusion proofs, that both can be mitigated without a
  new rule, and that it is unclear whether removing that SPV complication is
  worth the cost of a consensus change.
