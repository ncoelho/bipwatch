statement: Antoine Poinsot supports reviving the Great Consensus Cleanup,
  arguing the worst-case block validation time is concerning and that the
  timewarp bug, duplicate coinbase transactions and 64-byte transactions should
  be fixed. He also suggests limiting the maximum size of legacy transactions.
