statement: Melvin Carvalho opposes adding getblocktemplate fields (sequence,
  timestamp, version) to BIP 54, arguing that bundling them would make the
  otherwise uncontroversial consensus fixes controversial and widen the policy
  surface. He says these additions should be specified in a separate proposal.
