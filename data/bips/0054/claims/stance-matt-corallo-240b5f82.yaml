statement: Matt Corallo defends the Great Consensus Cleanup's plan to disable
  OP_CODESEPARATOR rather than merely limit how often it is called. He argues
  that limiting it adds a lot of complexity and makes sighash caching harder,
  while removing it allows a lot of code to be deleted.
