statement: Antoine Poinsot opposed the proposed edit distinguishing miner
  enforcement of BIP 54's two timestamp restrictions, saying the existing
  sentence is intentional. His reason is that an innocent block could plausibly
  violate the Timewarp rule, which applies to a single block interval, but not
  the rule against a negative-duration difficulty adjustment interval.
