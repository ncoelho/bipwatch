statement: Antoine Poinsot, BIP 54's author, defends its sigops-limit approach.
  He argues that the limit alone prevents serious network-stalling attacks at
  minimal confiscatory cost, and that adding further mitigations such as
  scriptPubKey size limits brings diminishing returns.
