statement: Sjors Provoost defends the Consensus Cleanup's invalidation of
  64-byte transactions. He argues that the real flaw is the original Merkle tree
  design, which only a hard fork could truly fix, so this rule is as good as a
  soft fork can do. He adds that it simplifies SPV proofs for other smart
  contract systems.
