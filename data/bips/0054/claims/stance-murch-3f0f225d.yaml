statement: "Murch opposes the proposed BIP 54 edit that exempts the Genesis
  block from the coinbase checks. He calls it incorrect and redundant: the
  specification already applies only to blocks after activation, and singling
  out Genesis would imply every later block, including those before activation,
  must follow the rule."
