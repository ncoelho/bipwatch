area: design
statement: Address the concern that invalidating 64-byte transactions forces
  layer-2 protocols that assemble transactions from several parties'
  contributions to check that the result is never exactly 64 bytes, and removes
  burn and anyone-can-spend constructions that protocols such as spacechains and
  miner fee bumping use.
