statement: Eric Voskuil opposes the Consensus Cleanup's proposed rule making
  64-byte transactions invalid. He argues it brings no performance gain over
  checking for a null coinbase point and adds a permanent consensus seam, and
  that it does not deliver unmalleable block hashes because duplicate-txid
  malleation remains. In his view the only benefit is small bandwidth savings
  for SPV proofs, which does not justify a new consensus rule.
