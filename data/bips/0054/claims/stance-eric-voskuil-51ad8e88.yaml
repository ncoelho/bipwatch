statement: Eric Voskuil opposes the Consensus Cleanup's rule making 64-byte
  transactions invalid. He argues it does not let nodes cache block invalidity
  any earlier, and that the existing null-coinbase-point check already detects
  that malleation earlier, faster and more simply. In his view the rule only
  adds redundant, costly late-stage checks and an arbitrary size discontinuity.
