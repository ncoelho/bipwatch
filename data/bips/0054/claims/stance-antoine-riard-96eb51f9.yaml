statement: Antoine Riard thinks a full "fast block malleability validation"
  algorithm should be designed, implemented and benchmarked in Bitcoin Core
  before the consensus cleanup's rule invalidating 64-byte transactions is
  considered further. His reason is that the efficiency of that rule depends
  heavily on the implementation.
