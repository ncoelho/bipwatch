statement: Matt Corallo argues that getblocktemplate should be replaced by his
  BetterHash protocol. He says getblocktemplate is slow because of JSON encoding
  and sending full transactions, needs protocol changes for new commitments such
  as SegWit's, and leaves block-switching logic outside the work provider.
