  title: "bip54: add coinbase locktime and sequence to GBT"
statement: Antoine Poinsot opposes extending getblocktemplate with coinbase
  locktime, sequence and version fields for BIP 54, and disagrees with linking
  to it from BIP 22. He argues that other consensus-relevant coinbase fields
  aren't provided by GBT either, and that the only GBT detail worth specifying
  is the "!" prefix for the bip54 rule.
