condition: The standard is simplified, with fewer optional variations and one
  way to express each behaviour, and its purpose and process are clearly
  described.
scope: proposal
statement: Pieter Wuille finds BIP 22 too complex, with too many optional
  features and redundant ways of specifying the same behaviour. He wants it
  simplified before he would support merging code that implements it, and
  sketches a simpler getblocktemplate/submitblocktemplate design.
