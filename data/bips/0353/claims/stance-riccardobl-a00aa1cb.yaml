statement: riccardobl argues against BIP 353's DNS-based approach and prefers an
  HTTPS .well-known approach. Their reasons are that DNS cannot be queried from
  webapps or extensions, offers no reliable control over caching, and is often
  unencrypted, which leaks payment intentions to ISPs.
