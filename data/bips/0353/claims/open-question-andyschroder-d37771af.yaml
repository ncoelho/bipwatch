area: design
statement: "Decide whether BIP 353 names should get their own URI form (such as
  bip353:, ₿: or BTC:) so they can be used in QR codes, clickable links and NFC
  intents. The decision was no: wallets must prefer direct URIs and copy the
  underlying URI rather than the name."
